<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
</head>
<body>

<div class="container">
    <h2>Log-in</h2>
    <form>
        <div class="row">
            <div class="mb-3 col-md-6">
                <label for="email" class="form-label">E-mail</label>
                <input type="text" class="form-control" id="email" placeholder="Enter your e-mail">
            </div>
            <div class="mb-3 col-md-6">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" placeholder="Enter your password">
            </div>
        </div>

        <div class="mb-3">
            <label for="address" class="form-label">Address</label>
            <input type="text" class="form-control-xl" id="address" placeholder="Enter your address">
        </div>
        <div class="mb-3">
            <label for="city">Select</label><select name="city" id="city" class="form-select">
                <option selected>Choose your city</option>
                <option value="mum">Mumbai</option>
                <option value="bhr">Bihar</option>
                <option value="pun">Pune</option>
            </select>
        </div>
        <div class="mb-3">
            <input type="checkbox" id="agree">
            <label for="agree" class="form-check-label">Agree</label>
        </div>
        <div class="mb-3 form-check">
            <input type="checkbox" id="agreebs" class="form=check-input">
            <label for="agreebs" class="form-check-lebel">Agree</label>
        </div>
        <div class="mb-3 form-check">
            <input type="radio" id="radiobs" class="form-check-input">
            <label for="radiobs" class="form-check-label">Agree</label>
        </div>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
