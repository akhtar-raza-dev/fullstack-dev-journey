<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Kanban Board</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="[&::-webkit-scrollbar]:hidden">

<div id="task-form-overlay"
     class="fixed inset-0 z-50 flex items-center justify-center hidden bg-black/70 backdrop-blur-sm p-4">
    <form id="create-task-form" autocomplete="off"
          class="w-full max-w-md bg-slate-900 rounded-2xl p-6 shadow-2xl border border-slate-700">
        <h2 class="text-3xl font-bold text-slate-100 mb-6 capitalize tracking-widest caret-transparent">add new
            tasks</h2>

        <div class="space-y-4">
            <div>
                <label for="task-title"
                       class="block text-sm font-medium text-slate-300 capitalize mb-1 caret-transparent">task
                    title</label>
                <input type="text" id="task-title" name="task-title" placeholder="Title..." required
                       class="w-full p-3 bg-slate-800 border border-slate-700 rounded-lg text-slate-100 focus:ring-2 focus:ring-slate-400 focus:outline-none focus:border-slate-500 transition-colors">
            </div>
            j

            <div>
                <label for="task-description"
                       class="block text-sm font-medium text-slate-300 capitalize mb-1 caret-transparent">description</label>
                <textarea id="task-description" name="task-description" rows="4" placeholder="Task description..."
                          class="w-full p-3 bg-slate-800 border border-slate-700 rounded-lg text-slate-100 focus:ring-2 focus:ring-slate-400 focus:outline-none focus:border-slate-500 transition-colors resize-none"></textarea>
            </div>
        </div>

        <div class="flex justify-end gap-3 mt-8">
            <button type="button" id="cancel-task-btn"
                    class="capitalize bg-slate-700 text-slate-100 px-4 py-2 rounded-lg font-semibold hover:bg-slate-600 focus:outline-none focus:ring-2 focus:ring-slate-500 transition-colors">
                cancel
            </button>
            <button type="submit" id="submit-task-btn"
                    class="capitalize bg-slate-100 text-slate-950 px-4 py-2 rounded-lg font-semibold hover:bg-slate-300 focus:outline-none focus:ring-2 focus:ring-slate-400 transition-colors">
                add task
            </button>
        </div>
    </form>
</div>

<main class="flex flex-col max-w-screen gap-4 p-4 bg-slate-950 font-sans caret-transparent">
    <header>
        <div class="flex justify-between items-center bg-slate-950 text-sm py-1 font-bold">
            <h1 class="capitalize text-slate-100 tracking-widest">kanban</h1>
            <button id="add-task-btn"
                    class="capitalize bg-slate-200 text-slate-900 px-3 py-1 rounded-lg font-bold hover:bg-slate-300 transition-colors focus:ring-2 focus:ring-slate-400">
                add new tasks
            </button>
        </div>
    </header>
    <section>
        <div class="grid grid-cols-3 gap-4 min-h-screen text-slate-200">
            <div id="todo-list" class="bg-slate-900 rounded-lg p-4">
                <div class="flex justify-between items-center mb-2 capitalize tracking-widest text-sm font-semibold">
                    <h2>to do</h2>
                    <h2 id="todo-count"></h2>
                </div>
                <div id="todo-container"
                     class="flex flex-col gap-4 min-h-full">
                </div>
            </div>

            <div id="progress-list" class="bg-slate-900 rounded-lg p-4">
                <div class="flex justify-between items-center mb-2 capitalize tracking-widest text-sm font-semibold">
                    <h2>in progress</h2>
                    <h2 id="progress-count">0</h2>
                </div>
                <div id="progress-container"
                     class="flex flex-col gap-4 min-h-full">
                </div>
            </div>

            <div id="done-list" class="bg-slate-900 rounded-lg p-4">
                <div class="flex justify-between items-center mb-2 capitalize tracking-widest text-sm font-semibold">
                    <h2>done</h2>
                    <h2 id="done-count">0</h2>
                </div>
                <div id="done-container"
                     class="flex flex-col gap-4 min-h-full">bb
                </div>
            </div>
        </div>
    </section>
</main>

<script src="script.js"></script>
</body>
</html>
