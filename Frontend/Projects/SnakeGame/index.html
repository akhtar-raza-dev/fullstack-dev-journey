<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Snake Game Developed by Akhtar Raza</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-950 font-sans">

<main class="min-h-screen flex flex-col items-center justify-center gap-6 p-4">

    <header class="w-full max-w-[800px]">
        <nav class="flex justify-between items-center text-sm tracking-widest text-zinc-400 uppercase font-bold">
            <div class="px-2 py-1"><h2>Pause: Space/P</h2></div>
            <div class="px-2 py-1"><h2 class="high-score"></h2></div>
            <div class="px-2 py-1"><h2 class="score"></h2></div>
            <div class="px-2 py-1"><h2 class="timer"></h2></div>
        </nav>
    </header>

    <section class="w-full flex justify-center">
        <div id="board"
             class="grid grid-cols-[repeat(40,minmax(0,1fr))] w-full max-w-[800px] aspect-[2/1] bg-zinc-900 rounded shadow-2xl overflow-hidden">
        </div>
    </section>
</main>
<div id="overlay"
     class="fixed inset-0 bg-black/70 backdrop-blur-sm flex justify-center items-center z-50 transition-opacity duration-300">
    <div class="flex flex-col items-center gap-8">
        <h1 id="overlay-text" class="text-zinc-200 text-4xl font-light tracking-widest uppercase">Snake</h1>
        <button id="start-btn"
                class="text-zinc-300 border border-zinc-600 px-8 py-3 rounded tracking-widest uppercase text-sm hover:bg-zinc-100 hover:text-black hover:border-zinc-100 transition-all duration-300">
            Play
        </button>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
